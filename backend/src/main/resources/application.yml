server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: growit-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:growit}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USER:growit}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  password:
    bcrypt-cost: ${PASSWORD_BCRYPT_COST:10}
  swagger:
    enabled: ${SWAGGER_ENABLED:false}
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:600}
    max-concurrency: ${AI_MAX_CONCURRENCY:2}
    user-daily-limit: ${AI_USER_DAILY_LIMIT:5}
    global-daily-limit: ${AI_GLOBAL_DAILY_LIMIT:100}
    analysis-user-daily-limit: ${AI_ANALYSIS_USER_DAILY_LIMIT:30}
    simplify-user-daily-limit: ${AI_SIMPLIFY_USER_DAILY_LIMIT:5}
    view-user-daily-limit: ${AI_VIEW_USER_DAILY_LIMIT:20}

springdoc:
  api-docs:
    enabled: ${app.swagger.enabled}
  swagger-ui:
    enabled: ${app.swagger.enabled}
